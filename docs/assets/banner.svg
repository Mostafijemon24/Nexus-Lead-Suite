      <rect x="360" y="200" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/><text x="416" y="222" text-anchor="middle">Popups</text>
      <rect x="482" y="200" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/><text x="557" y="222" text-anchor="middle">Smart Buttons</text>
      <rect x="642" y="200" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/><text x="717" y="222" text-anchor="middle">Email automation</text>
      <rect x="802" y="200" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/><text x="862" y="222" text-anchor="middle">AI chatbot</text>
      <rect x="932" y="200" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.1"/><text x="988" y="222" text-anchor="middle">Analytics</text>
