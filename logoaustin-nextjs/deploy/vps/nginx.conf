# /etc/nginx/sites-available/logoaustin.com
# Reverse proxy for the Next.js standalone server (PM2, port 3000). Certbot adds the TLS blocks.

server {
    listen 80;
    listen [::]:80;
    server_name logoaustin.com www.logoaustin.com;
    return 301 https://logoaustin.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.logoaustin.com;
    # ssl_certificate ... (certbot)
    return 301 https://logoaustin.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logoaustin.com;
    # ssl_certificate /etc/letsencrypt/live/logoaustin.com/fullchain.pem;   (certbot)
    # ssl_certificate_key /etc/letsencrypt/live/logoaustin.com/privkey.pem; (certbot)

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 1024;
    # brotli on; brotli_types ...;   (if the brotli module is installed)

    client_max_body_size 2m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(images|logos)/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
